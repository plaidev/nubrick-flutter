# This action is forked from subosito/flutter-action@v2.21.0

name: Set up Flutter
description: Install a requested Flutter version or the version in .fvmrc and cache the SDK and pub dependencies.

inputs:
  flutter-version:
    description: Flutter version to install. Defaults to .fvmrc.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve Flutter version
      id: fvm-config
      shell: bash
      env:
        REQUESTED_FLUTTER_VERSION: ${{ inputs.flutter-version }}
      run: |
        version="$REQUESTED_FLUTTER_VERSION"
        if [ -z "$version" ]; then
          version="$(jq -er '.flutter | select(type == "string" and length > 0)' "$GITHUB_WORKSPACE/.fvmrc")"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Make setup script executable
      run: chmod +x "$GITHUB_ACTION_PATH/setup.sh"
      shell: bash

    - name: Set action inputs
      id: flutter-action
      shell: bash
      env:
        FLUTTER_VERSION: ${{ steps.fvm-config.outputs.version }}
      run: |
        $GITHUB_ACTION_PATH/setup.sh -p -n "$FLUTTER_VERSION" stable

    - name: Cache Flutter
      id: cache-flutter
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.flutter-action.outputs.CACHE-PATH }}
        key: ${{ steps.flutter-action.outputs.CACHE-KEY }}

    - name: Cache pub dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache-pub
      with:
        path: ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}
        key: ${{ steps.flutter-action.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}

    - name: Run setup script
      shell: bash
      run: |
        $GITHUB_ACTION_PATH/setup.sh \
          -n '${{ steps.flutter-action.outputs.VERSION }}' \
          -a '${{ steps.flutter-action.outputs.ARCHITECTURE }}' \
          -c '${{ steps.flutter-action.outputs.CACHE-PATH }}' \
          -d '${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}' \
          ${{ steps.flutter-action.outputs.CHANNEL }}
