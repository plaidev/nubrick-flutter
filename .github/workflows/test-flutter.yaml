name: "[flutter] Test Nubrick SDK"

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to validate.
        required: true
        type: string
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - .github/workflows/e2e.yaml
      - .gitignore
      - README.md
  pull_request:
    branches: [ main ]
    paths-ignore:
      - .github/workflows/e2e.yaml
      - .gitignore
      - README.md

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        flutter-version: ['3.44.0', '']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ matrix.flutter-version }}

      - name: Check version consistency
        run: |
          # Extract version from pubspec.yaml
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')

          # Extract version from lib/version.dart
          VERSION_DART=$(grep 'const String nubrickFlutterSdkVersion' lib/version.dart | sed "s/.*'\(.*\)'.*/\1/")

          echo "pubspec.yaml version: $PUBSPEC_VERSION"
          echo "lib/version.dart version: $VERSION_DART"

          if [ "$PUBSPEC_VERSION" != "$VERSION_DART" ]; then
            echo "Error: Version mismatch between pubspec.yaml ($PUBSPEC_VERSION) and lib/version.dart ($VERSION_DART)"
            echo "Please run 'make bump-version VERSION=x.y.z' to update both versions consistently"
            exit 1
          fi

          echo "Version consistency check passed"

      - name: Check licensing files
        run: |
          test -f LICENSE
          test -f NOTICE
          grep -q 'Apache License' LICENSE
          grep -q 'Version 2.0, January 2004' LICENSE
          grep -q 'Copyright 2026 PLAID, Inc.' NOTICE

      - name: Run tests
        run: flutter test

      - name: Validate package
        run: dart pub publish --dry-run

  spm:
    strategy:
      matrix:
        include:
          - flutter-version: '3.44.0'
            build-device: true
          - flutter-version: ''
            build-device: false
    uses: ./.github/workflows/validate-spm.yaml
    with:
      ref: ${{ inputs.ref || github.sha }}
      flutter-version: ${{ matrix.flutter-version }}
      build-device: ${{ matrix.build-device }}

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up minimum Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: '3.44.0'

      - name: Build Android consumer
        working-directory: example
        run: flutter build apk --debug
