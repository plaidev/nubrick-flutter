name: Release SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (vX.Y.Z)"
        required: true
        type: string
      release_notes:
        description: "Release notes; separate multiple items with |"
        required: true
        type: string
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: flutter-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Only Main
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Validate requested release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stop on command errors, unset variables, and pipeline failures.
          set -euo pipefail
          # Require a semantic version release tag.
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Expected a release tag in vX.Y.Z format" >&2
            exit 1
          }
          # Remove the v prefix to get the package version.
          VERSION="${RELEASE_TAG#v}"
          # Build the release branch name from the package version.
          BRANCH="release/${VERSION}"
          # Stop if this release tag already exists on origin.
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Tag ${RELEASE_TAG} already exists" >&2
            exit 1
          fi
          # Stop if this release branch already exists on origin.
          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null; then
            echo "Branch ${BRANCH} already exists" >&2
            exit 1
          fi
          # Stop if a GitHub Release already exists for this tag.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists" >&2
            exit 1
          fi
          # Check whether this package version is already published on pub.dev.
          HTTP_CODE=$(curl --silent --show-error --location --retry 3 \
            --output /tmp/nubrick-pub-version.json --write-out '%{http_code}' \
            "https://pub.dev/api/packages/nubrick_flutter/versions/${VERSION}")
          # Accept 404; reject an existing version or any other lookup result.
          case "$HTTP_CODE" in
            404) ;;
            200) echo "pub.dev already has version ${VERSION}" >&2; exit 1 ;;
            *) echo "pub.dev lookup failed with HTTP ${HTTP_CODE}" >&2; exit 1 ;;
          esac
          # Export the release branch for later workflow steps.
          echo "RELEASE_BRANCH=${BRANCH}" >> "$GITHUB_ENV"

      - name: Prepare release metadata
        run: python3 .github/scripts/release.py prepare

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Refresh example and E2E lockfiles
        shell: bash
        run: |
          set -euo pipefail
          (cd example && flutter pub get)
          (cd e2e && flutter pub get)

      - name: Verify release metadata
        run: python3 .github/scripts/release.py verify

      - name: Check generated release diff
        run: git diff --check

      - name: Create release PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOMI_PAT }}
          RELEASE_PAT: ${{ secrets.RELEASE_TOMI_PAT }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_PAT" ]] || { echo "Set the RELEASE_TOMI_PAT repository secret" >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$RELEASE_BRANCH"
          git add pubspec.yaml lib/version.dart CHANGELOG.md \
            example/pubspec.lock e2e/pubspec.lock
          git commit -m "Prepare ${RELEASE_TAG} release"
          git config --local --unset-all http.https://github.com/.extraheader || true
          AUTH_HEADER=$(printf 'x-access-token:%s' "$RELEASE_PAT" | base64 | tr -d '\n')
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" \
            push origin "$RELEASE_BRANCH"
          cat > /tmp/release-pr-body.md <<EOF
          ## Summary
          - Prepare Flutter SDK ${RELEASE_TAG} for release.
          - Keep the native SDK dependency versions pinned in main.

          ## Validation
          - PR CI: flutter test and dart pub publish --dry-run
          - Release metadata and example/E2E lockfile checks

          Review the PR CI results and merge only after they pass. Merging starts the tag and publication steps.
          EOF
          gh pr create --base main --head "$RELEASE_BRANCH" \
            --title "Prepare ${RELEASE_TAG} release" --body-file /tmp/release-pr-body.md

  tag:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: Only Main
    permissions:
      contents: read
    env:
      RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Check out merged release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Validate merged release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_BRANCH" =~ ^release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Unexpected release branch: ${RELEASE_BRANCH}" >&2
            exit 1
          }
          echo "RELEASE_TAG=v${RELEASE_BRANCH#release/}" >> "$GITHUB_ENV"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$MERGE_SHA" origin/main

      - name: Verify release metadata
        run: python3 .github/scripts/release.py verify

      - name: Check existing tag
        id: tag-state
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null
          STATUS=$?
          set -e
          case "$STATUS" in
            0)
              git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
              TAG_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
              if [[ "$TAG_SHA" != "$MERGE_SHA" ]]; then
                echo "Existing tag ${RELEASE_TAG} points to ${TAG_SHA}, not ${MERGE_SHA}" >&2
                exit 1
              fi
              echo "already_exists=true" >> "$GITHUB_OUTPUT"
              ;;
            2) echo "already_exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unable to check remote tag: git exited ${STATUS}" >&2; exit 1 ;;
          esac

      - name: Set up Flutter
        if: steps.tag-state.outputs.already_exists == 'false'
        uses: ./.github/actions/setup-flutter

      - name: Test merged release
        if: steps.tag-state.outputs.already_exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          flutter test
          dart pub publish --dry-run

      - name: Ensure version is not already published
        if: steps.tag-state.outputs.already_exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          HTTP_CODE=$(curl --silent --show-error --location --retry 3 \
            --output /tmp/nubrick-pub-version.json --write-out '%{http_code}' \
            "https://pub.dev/api/packages/nubrick_flutter/versions/${VERSION}")
          case "$HTTP_CODE" in
            404) ;;
            200) echo "pub.dev already has version ${VERSION}" >&2; exit 1 ;;
            *) echo "pub.dev lookup failed with HTTP ${HTTP_CODE}" >&2; exit 1 ;;
          esac

      - name: Push release tag
        if: steps.tag-state.outputs.already_exists == 'false'
        shell: bash
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_TOMI_PAT }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_PAT" ]] || { echo "Set the RELEASE_TOMI_PAT repository secret" >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release ${RELEASE_TAG}" "$MERGE_SHA"
          git config --local --unset-all http.https://github.com/.extraheader || true
          AUTH_HEADER=$(printf 'x-access-token:%s' "$RELEASE_PAT" | base64 | tr -d '\n')
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" \
            push origin "refs/tags/${RELEASE_TAG}"
